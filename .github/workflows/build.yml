name: Build FaceGate (GStreamer + libyuv + ShadowHook-static + APK + Magisk Module)

on:
  workflow_dispatch:
    inputs:
      reuse_gstreamer_run_id:
        description: "Blank reuses run 33233745525; enter fresh to rebuild current GStreamer"
        required: false
        type: string
        default: ""
  push:
    branches: [ "main", "master", "gstreamer.2" ]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 -- Build all native C/C++ libraries for Android
  # ---------------------------------------------------------------------------
  build-native-libs:
    name: Native Libs (GStreamer * libyuv * ShadowHook-static * turbojpeg)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache NDK r25c
        uses: actions/cache@v4
        with:
          path: android-ndk-r25c
          key: ndk-r25c-linux-v9

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y build-essential gperf nasm yasm wget unzip cmake ninja-build perl python3

      - name: Download Android NDK r25c
        run: |
          if [ ! -d "android-ndk-r25c" ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
            unzip -q android-ndk-r25c-linux.zip
            rm android-ndk-r25c-linux.zip
          fi
          echo "NDK=$PWD/android-ndk-r25c"              >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      # -- OpenSSL -------------------------------------------------------------
      # Kept as a standalone native artifact for the injector/release path;
      # GStreamer itself uses the OpenSSL GIO module from its Cerbero prefix.
      - name: Build OpenSSL for Android
        run: |
          git clone --depth 1 --branch openssl-3.1.4 \
            https://github.com/openssl/openssl.git openssl-src
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          API=24

          build_openssl() {
            local ABI=$1 ARCH=$2 OPTS=$3
            export ANDROID_NDK_ROOT=$NDK
            export PATH=$TOOLCHAIN/bin:$PATH
            mkdir -p openssl-src/build-$ABI
            cd openssl-src/build-$ABI
            ../Configure android-$ARCH -D__ANDROID_API__=$API \
              --prefix=$GITHUB_WORKSPACE/openssl/$ABI \
              --openssldir=$GITHUB_WORKSPACE/openssl/$ABI \
              no-shared no-tests no-ui-console $OPTS
            make -j$(nproc) && make install_sw
            cd ../..
          }
          build_openssl "arm64-v8a"   "arm64"  ""
          build_openssl "armeabi-v7a" "arm"    "no-asm"
          build_openssl "x86_64"      "x86_64"  ""

      # Cerbero master currently targets NDK r29. Keep it separate from r25c,
      # which remains the toolchain used by the injector and other native libs.
      - name: Cache Android NDK r29 for Cerbero
        if: ${{ inputs.reuse_gstreamer_run_id == 'fresh' }}
        uses: actions/cache@v4
        with:
          path: gstreamer-ndk-r29
          key: ndk-r29-linux-v1

      - name: Download Android NDK r29 for Cerbero
        if: ${{ inputs.reuse_gstreamer_run_id == 'fresh' }}
        run: |
          if [ ! -d "gstreamer-ndk-r29" ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
            unzip -q android-ndk-r29-linux.zip
            rm android-ndk-r29-linux.zip
            mv android-ndk-r29 gstreamer-ndk-r29
          fi
          test -x gstreamer-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin/clang

      # -- GStreamer -----------------------------------------------------------
      # By default gstreamer.2 reuses the compatible multi-ABI SDK from run
      # 33233745525. Dispatch with reuse_gstreamer_run_id=fresh when a new
      # current-upstream Cerbero build is required.
      # Build the current upstream GStreamer Android SDK with Cerbero.  The
      # app uses GStreamerMobile's static-plugin bridge, so RTSP/RTP, local
      # containers, Android MediaCodec, conversion, and appsrc/appsink are
      # all linked into the application process rather than shelling out to a
      # command-line process.
      - name: Build latest GStreamer for Android with Cerbero
        if: ${{ inputs.reuse_gstreamer_run_id == 'fresh' }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/GStreamer/cerbero.git gstreamer-cerbero
          # Keep the Android SDK on GStreamer-native codecs. The generic
          # upstream package also references gst-libav through gst-android and
          # dump-versions; remove those package-only references so FFmpeg is not
          # pulled into this branch or its artifacts.
          #
          # The current Cerbero recipe still points at the retired
          # freedesktop.org download path for WebRTC AudioProcessing 2.1.
          # Keep the WebRTC plugin available, but use its current GitLab release
          # archive and matching extracted directory/checksum.
          python3 - <<'PYREMOVE'
          from pathlib import Path
          import re

          # Keep the Android SDK on GStreamer-native codecs. The generic
          # upstream package also references gst-libav through gst-android and
          # dump-versions; remove those package-only references so FFmpeg is not
          # pulled into this branch or its artifacts. Replace the dependency
          # token in-place so dump-versions keeps valid Python list syntax.
          unwanted = "'gst-" + "lib" + "av-1.0',"
          for name in ("gst-android-1.0.recipe", "dump-versions.recipe", "custom.py"):
              recipe = Path("gstreamer-cerbero/recipes") / name
              recipe.write_text(recipe.read_text().replace(unwanted, ""))

          # Cerbero's current WebRTC AudioProcessing recipe still points at the
          # retired freedesktop.org download path for version 2.1. Keep the
          # plugin enabled, but use its current GitLab release archive.
          webrtc = Path("gstreamer-cerbero/recipes/webrtc-audio-processing.recipe")
          recipe_text = webrtc.read_text()
          recipe_text, count = re.subn(
              r"url = 'https://freedesktop\.org/software/pulseaudio/%\(name\)s/%\(name\)s-%\(version\)s\.tar\.gz'",
              "url = 'https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing/-/archive/v%(version)s/webrtc-audio-processing-v%(version)s.tar.gz'",
              recipe_text,
          )
          if count != 1:
              raise SystemExit("could not update WebRTC AudioProcessing source URL")
          recipe_text, count = re.subn(
              r"    tarball_checksum = '[0-9a-f]+'",
              "    tarball_checksum = '2358883a8551711f3b6169f6799c003dc1a6efd37bdb24a135a015cc9e3d7713'",
              recipe_text,
          )
          if count != 1:
              raise SystemExit("could not update WebRTC AudioProcessing checksum")
          if "tarball_dirname" not in recipe_text:
              recipe_text = recipe_text.replace(
                  "    stype = SourceType.TARBALL\n",
                  "    stype = SourceType.TARBALL\n"
                  "    tarball_dirname = 'webrtc-audio-processing-v%(version)s'\n",
                  1,
              )
          webrtc.write_text(recipe_text)

          # zlib.net served a zlib-1.3.1 tarball with bytes that do not match
          # Cerbero's recorded checksum on the GitHub runner. Use the stable
          # upstream GitHub tag archive instead; it has the same source tree
          # and a reproducible checksum.
          zlib = Path("gstreamer-cerbero/recipes/zlib.recipe")
          zlib_text = zlib.read_text()
          old_zlib_url = "url = 'https://zlib.net/fossils/zlib-%(version)s.tar.gz'"
          new_zlib_url = "url = 'https://github.com/madler/zlib/archive/refs/tags/v%(version)s.tar.gz'"
          if old_zlib_url not in zlib_text:
              raise SystemExit("could not update zlib source URL")
          zlib_text = zlib_text.replace(old_zlib_url, new_zlib_url, 1)
          zlib_text, count = re.subn(
              r"    tarball_checksum = '[0-9a-f]+'",
              "    tarball_checksum = '17e88863f3600672ab49182f217281b6fc4d3c762bde361935e436a95214d05c'",
              zlib_text,
          )
          if count != 1:
              raise SystemExit("could not update zlib checksum")
          zlib.write_text(zlib_text)
          PYREMOVE
          mkdir -p gstreamer-android gstreamer-home

          build_gstreamer_abi() {
            local ABI_CONFIG=$1
            local ABI_DIR=$2
            local HOME_DIR="$GITHUB_WORKSPACE/gstreamer-home/$ABI_DIR"
            local CERBERO_CONFIG="config/cross-android-${ABI_CONFIG}.cbc"
            local PREFIX="$HOME_DIR/dist/android_${ABI_CONFIG}"
            local SDK_OUT="$GITHUB_WORKSPACE/gstreamer-android/$ABI_DIR"

            # Cerbero's Android configuration defaults to NDK r29.  Keep this
            # toolchain separate from the existing r25c used by the injector.
            cat > gstreamer-cerbero/localconf.cbc <<EOF
          home_dir = "$HOME_DIR"
          toolchain_prefix = "$GITHUB_WORKSPACE/gstreamer-ndk-r29"
          recipes_commits = {"gstreamer-1.0": "origin/main"}
          EOF

            echo "=== Bootstrapping Cerbero for $ABI_DIR ==="
            (cd gstreamer-cerbero && ./cerbero-uninstalled \
              -c localconf.cbc -c "$CERBERO_CONFIG" \
              bootstrap --system=no --toolchains=yes --build-tools=yes)

            # The current Cerbero master resolves all GStreamer recipes from
            # upstream GStreamer git main.  The full installed prefix is kept
            # rather than only the runtime tarball: the Android CMake bridge
            # needs the matching headers, pkg-config files, static API libs,
            # static plugin archives, GIO modules, and certificate bundle.
            echo "=== Building current upstream GStreamer for $ABI_DIR ==="
            (cd gstreamer-cerbero && ./cerbero-uninstalled \
              -c localconf.cbc -c "$CERBERO_CONFIG" \
              package --jobs "$(nproc)" gstreamer-1.0)

            test -d "$PREFIX/include"
            test -d "$PREFIX/lib"
            test -f "$PREFIX/share/gst-android/ndk-build/plugins.cmake"
            test -f "$PREFIX/share/cmake/FindGStreamerMobile.cmake"
            test -f "$PREFIX/share/gst-android/ndk-build/GStreamer.java"
            test -f "$PREFIX/lib/pkgconfig/gstreamer-1.0.pc"
            for API in \
                gstreamer-1.0:gstreamer-1.0 \
                gstapp-1.0:gstreamer-app-1.0 \
                gstaudio-1.0:gstreamer-audio-1.0 \
                gstvideo-1.0:gstreamer-video-1.0 \
                gstpbutils-1.0:gstreamer-pbutils-1.0 \
                gstrtp-1.0:gstreamer-rtp-1.0 \
                gstrtsp-1.0:gstreamer-rtsp-1.0 \
                gstsdp-1.0:gstreamer-sdp-1.0; do
              ARCHIVE=${API%%:*}
              PC=${API##*:}
              test -f "$PREFIX/lib/lib${ARCHIVE}.a"
              test -f "$PREFIX/lib/pkgconfig/${PC}.pc"
            done
            for PLUGIN in coreelements app audioconvert audioresample videoconvertscale playback rtsp rtp rtpmanager soup tcp udp androidmedia; do
              test -f "$PREFIX/lib/gstreamer-1.0/libgst${PLUGIN}.a"
            done
            test -f "$PREFIX/lib/gio/modules/libgioopenssl.a"
            test -f "$PREFIX/etc/ssl/certs/ca-certificates.crt"

            # Current Cerbero generates plugins.cmake from static archive
            # names, while FindGStreamer.cmake resolves each requested plugin
            # through pkg-config. Generate the missing per-plugin metadata in
            # the SDK so the documented static CMake bridge can consume it.
            python3 - "$PREFIX" <<'PYPLUGINPC'
          from pathlib import Path
          import re
          import sys

          prefix = Path(sys.argv[1])
          plugin_dir = prefix / "lib" / "gstreamer-1.0"
          pc_dir = plugin_dir / "pkgconfig"
          pc_dir.mkdir(parents=True, exist_ok=True)
          version = "1.0"
          for line in (prefix / "lib" / "pkgconfig" / "gstreamer-1.0.pc").read_text().splitlines():
              if line.startswith("Version:"):
                  version = line.split(":", 1)[1].strip()
                  break
          plugins = []
          for line in (prefix / "share" / "gst-android" / "ndk-build" / "plugins.cmake").read_text().splitlines():
              match = re.match(r"set\(GSTREAMER_PLUGINS_[^ ]+\s+(.*)\)$", line)
              if match:
                  plugins.extend(match.group(1).split())
          for plugin in dict.fromkeys(plugins):
              archive = plugin_dir / f"libgst{plugin}.a"
              if not archive.is_file():
                  raise SystemExit(f"missing static GStreamer plugin archive: {archive}")
              (pc_dir / f"gst{plugin}.pc").write_text(
                  f"prefix={prefix}\n"
                  "libdir=${prefix}/lib/gstreamer-1.0\n"
                  f"Name: gst{plugin}\n"
                  f"Description: GStreamer static plugin {plugin}\n"
                  f"Version: {version}\n"
                  "Libs: -L${libdir} -lgst" + plugin + "\n"
                  "Cflags: -I${prefix}/include/gstreamer-1.0\n"
              )
          print(f"generated {len(set(plugins))} static plugin pkg-config modules")
          PYPLUGINPC

            mkdir -p "$SDK_OUT"
            cp -a "$PREFIX/." "$SDK_OUT/"
            echo "=== GStreamer SDK $ABI_DIR ==="
            # Use sed instead of head so pipefail does not treat sort's
            # expected SIGPIPE as a build failure when the SDK has >120 files.
            find "$SDK_OUT/lib" -maxdepth 3 -type f | sort | sed -n '1,120p'
          }

          # Artifact directory names intentionally match ANDROID_ABI values
          # used by Gradle/CMake while Cerbero uses arm64/armv7 internally.
          build_gstreamer_abi arm64 arm64-v8a
          build_gstreamer_abi armv7 armeabi-v7a

          echo "=== GStreamer SDK output ==="
          find gstreamer-android -maxdepth 3 -type f | sort | sed -n '1,200p'

      # -- libyuv (Google Chromium) ---------------------------------------------
      - name: Build libyuv for Android
        run: |
          git clone --depth 1 https://chromium.googlesource.com/libyuv/libyuv libyuv-src
          LIBYUV_OUT=$GITHUB_WORKSPACE/libyuv-prebuilt
          mkdir -p $LIBYUV_OUT/include
          cp -r libyuv-src/include/libyuv* $LIBYUV_OUT/include/

          build_libyuv() {
            local ABI=$1
            mkdir -p libyuv-build-$ABI
            cmake libyuv-src \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DCMAKE_BUILD_TYPE=MinSizeRel \
              -GNinja \
              -B libyuv-build-$ABI
            cmake --build libyuv-build-$ABI --target yuv -j$(nproc)
            mkdir -p $LIBYUV_OUT/$ABI
            cp libyuv-build-$ABI/libyuv.a $LIBYUV_OUT/$ABI/
          }
          build_libyuv "arm64-v8a"
          build_libyuv "armeabi-v7a"
          build_libyuv "x86_64"

      # -- ShadowHook -- build from source as STATIC library --------------------
      # IMPORTANT: The Maven Central AAR only contains .so files -- no .a.
      # We must build from source and patch SHARED->STATIC.
      # ShadowHook only supports armeabi-v7a and arm64-v8a (no x86_64).
      - name: Build ShadowHook from source (static, arm64+armv7 only)
        run: |
          # -- Clone with pinned tag for reproducibility -----------------------
          # Using a known-good tag instead of floating 'main' prevents upstream
          # breaking changes from silently breaking our build.
          # PIN REMOVED: v2.0.1 tag predates shadowhook_hook_sym_addr_2(),
          # SHADOWHOOK_HOOK_WITH_SHARED_MODE (=1), and SHADOWHOOK_CALL_PREV which
          # hook_proxy.cpp uses.  Latest main has all three under version 2.0.1.
          git clone --depth 1 \
            https://github.com/bytedance/android-inline-hook.git shadowhook-src

          SH_OUT=$GITHUB_WORKSPACE/shadowhook-prebuilt
          mkdir -p "$SH_OUT/include"

          SHADOWHOOK_CMAKE="shadowhook-src/shadowhook/src/main/cpp/CMakeLists.txt"

          # -- Verify upstream file exists ------------------------------------
          if [ ! -f "$SHADOWHOOK_CMAKE" ]; then
            echo "FATAL: $SHADOWHOOK_CMAKE not found after clone"
            find shadowhook-src -name "CMakeLists.txt" 2>/dev/null || true
            exit 1
          fi

          echo "=== Original CMakeLists.txt (first 5 lines) ==="
          head -n 5 "$SHADOWHOOK_CMAKE"

          # -- Patch CMakeLists.txt --------------------------------------------
          # 1. Lower cmake_minimum_required: upstream may use 3.30.5, 4.0.2, etc.
          #    Use version-agnostic regex to match ANY version string.
          sed -i 's/cmake_minimum_required(VERSION [^)]*)/cmake_minimum_required(VERSION 3.10)/' "$SHADOWHOOK_CMAKE"

          # 2. SHARED -> STATIC for the main shadowhook target
          sed -i 's/add_library(${TARGET} SHARED/add_library(${TARGET} STATIC/' "$SHADOWHOOK_CMAKE"

          # 3. Remove --version-script linker flag (only valid for shared libs)
          sed -i '/-Wl,--version-script/d' "$SHADOWHOOK_CMAKE"

          # 4. Remove -Werror to prevent warnings from killing the build
          sed -i 's/-Werror//g' "$SHADOWHOOK_CMAKE"

          # 5. Remove the shadowhook_nothing target entirely (shared-only, not needed for static)
          python3 - <<'PYEOF'
          import sys
          cmake_path = 'shadowhook-src/shadowhook/src/main/cpp/CMakeLists.txt'
          with open(cmake_path, 'r') as f:
              content = f.read()
          marker = '\nset(TARGET "shadowhook_nothing")'
          idx = content.find(marker)
          if idx >= 0:
              content = content[:idx] + '\n'
              print("Removed shadowhook_nothing target")
          else:
              print("WARNING: shadowhook_nothing marker not found -- upstream may have changed structure")
          with open(cmake_path, 'w') as f:
              f.write(content)
          print("CMakeLists.txt patched OK")
          PYEOF

          # -- Verify the cmake_minimum_required patch actually took effect --
          echo "=== Verifying cmake_minimum_required patch ==="
          if grep -q "cmake_minimum_required(VERSION 3.10)" "$SHADOWHOOK_CMAKE"; then
            echo "- cmake_minimum_required successfully patched to 3.10"
          else
            echo "- FATAL: cmake_minimum_required patch FAILED. File still contains:"
            grep -n "cmake_minimum_required" "$SHADOWHOOK_CMAKE" || true
            echo "=== Full file content ==="
            cat "$SHADOWHOOK_CMAKE"
            exit 1
          fi

          echo "=== Patched CMakeLists.txt ==="
          cat "$SHADOWHOOK_CMAKE"

          # Copy public header
          cp "shadowhook-src/shadowhook/src/main/cpp/include/shadowhook.h" "$SH_OUT/include/"
            # -- Stub sh_linker_init -> always returns 0 (ERRNO_INIT_LINKER=12 fix) --------
            # ROOT CAUSE of 'shadowhook_init failed: Init linker mod failed' (errno=12):
            #   When libhookProxy.so is loaded via memfd+ptrace it has no file-backed
            #   path in /proc/self/maps. sh_linker_init() scans maps to find itself
            #   (to locate the linker base), finds nothing, and returns error.
            #   shadowhook_init() aborts with ERRNO_INIT_LINKER=12, blocking all hooks.
            # FIX: replace sh_linker_init() in shadowhook.c with (0) so init always
            #   succeeds. Linker monitoring is only for deferred by-name hooks;
            #   we use shadowhook_hook_sym_addr_2() on already-resolved addresses.
            # -- Stub sh_linker_init -> always returns 0 (ERRNO_INIT_LINKER=12 fix) --------
            # ROOT CAUSE: sh_linker_init() scans /proc/self/maps to find the linker base,
            #   but libhookProxy.so loaded via memfd+ptrace has no file-backed path there,
            #   so it fails -> shadowhook_init returns errno=12 (ERRNO_INIT_LINKER=12).
            # FIX: stub sh_linker_init() -> return 0 in shadowhook.c. We use only
            #   shadowhook_hook_sym_addr_2() (addr-based), so linker monitoring is unused.
            SH_C=shadowhook-src/shadowhook/src/main/cpp/shadowhook.c
            COUNT=$(grep -c 'sh_linker_init()' "$SH_C" 2>/dev/null || echo 0)
            sed -i 's/sh_linker_init()/(0)/g' "$SH_C"
            if [ "$COUNT" -eq 0 ]; then
              echo 'WARNING: sh_linker_init() not found in shadowhook.c -- upstream may have renamed it'
            else
              echo "sh_linker_init stubbed in shadowhook.c ($COUNT occurrence(s))"
            fi

          build_shadowhook() {
            local ABI=$1
            mkdir -p shadowhook-build-$ABI "$SH_OUT/$ABI"
            cmake shadowhook-src/shadowhook/src/main/cpp \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-21 \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_C_STANDARD=99 \
              -GNinja \
              -B shadowhook-build-$ABI
            cmake --build shadowhook-build-$ABI -j$(nproc)
            STATIC_LIB=$(find shadowhook-build-$ABI -name "libshadowhook*.a" | head -1)
            if [ -z "$STATIC_LIB" ]; then
              echo "FATAL: libshadowhook*.a not found for $ABI after build"
              find shadowhook-build-$ABI -type f | sort
              exit 1
            fi
            cp "$STATIC_LIB" "$SH_OUT/$ABI/libshadowhook.a"
            echo "ShadowHook $ABI: static OK -- $(file "$SH_OUT/$ABI/libshadowhook.a")"
          }

          build_shadowhook "arm64-v8a"
          build_shadowhook "armeabi-v7a"

          echo "=== ShadowHook prebuilt ==="
          find "$SH_OUT" -type f | sort

      # -- libjpeg-turbo 3.0.2 -------------------------------------------------
      - name: Build libjpeg-turbo for Android
        run: |
          git clone --depth 1 --branch 3.0.2 \
            https://github.com/libjpeg-turbo/libjpeg-turbo.git turbojpeg-src
          TJ_OUT=$GITHUB_WORKSPACE/turbojpeg-prebuilt
          mkdir -p $TJ_OUT/include
          cp turbojpeg-src/turbojpeg.h "$TJ_OUT/include/" 2>/dev/null || true

          build_tj() {
            local ABI=$1
            mkdir -p turbojpeg-build-$ABI
            cmake turbojpeg-src \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DCMAKE_BUILD_TYPE=MinSizeRel \
              -DENABLE_SHARED=OFF \
              -DENABLE_STATIC=ON \
              -DWITH_TURBOJPEG=ON \
              -GNinja \
              -B turbojpeg-build-$ABI
            cmake --build turbojpeg-build-$ABI --target turbojpeg-static -j$(nproc)
            mkdir -p "$TJ_OUT/$ABI"
            cp turbojpeg-build-$ABI/libturbojpeg.a "$TJ_OUT/$ABI/"
          }
          build_tj "arm64-v8a"
          build_tj "armeabi-v7a"
          build_tj "x86_64"

      # -- Upload all native artifacts ------------------------------------------
      - name: Upload GStreamer
        if: ${{ inputs.reuse_gstreamer_run_id == 'fresh' }}
        uses: actions/upload-artifact@v4
        with:
          name: gstreamer-android-prebuilt
          path: gstreamer-android/
          retention-days: 14


      - name: Upload OpenSSL
        uses: actions/upload-artifact@v4
        with:
          name: openssl-android-prebuilt
          path: openssl/
          retention-days: 14

      - name: Upload libyuv
        uses: actions/upload-artifact@v4
        with:
          name: libyuv-android-prebuilt
          path: libyuv-prebuilt/
          retention-days: 14

      - name: Upload ShadowHook
        uses: actions/upload-artifact@v4
        with:
          name: shadowhook-android-prebuilt
          path: shadowhook-prebuilt/
          retention-days: 14

      - name: Upload turbojpeg
        uses: actions/upload-artifact@v4
        with:
          name: turbojpeg-android-prebuilt
          path: turbojpeg-prebuilt/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2 -- Build APK (itsme5) -- pure in-app ptrace injection, no module
  # ---------------------------------------------------------------------------
  build-apk-and-module:
    name: APK + Magisk Module (fg/)
    needs: build-native-libs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout itsme5 into fg/
        uses: actions/checkout@v4
        with:
          repository: laroi254/itsme5
          token: ${{ secrets.APP_REPO_PAT }}
          path: fg
          ref: gstreamer.2

      - name: Download GStreamer from this run
        if: ${{ inputs.reuse_gstreamer_run_id == 'fresh' }}
        uses: actions/download-artifact@v4
        with:
          name: gstreamer-android-prebuilt
          path: fg/gstreamer-android

      - name: Reuse compatible GStreamer artifact (default run)
        if: ${{ inputs.reuse_gstreamer_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: gstreamer-android-prebuilt
          path: fg/gstreamer-android
          github-token: ${{ github.token }}
          run-id: 33233745525

      - name: Reuse compatible GStreamer artifact (selected run)
        if: ${{ inputs.reuse_gstreamer_run_id != '' && inputs.reuse_gstreamer_run_id != 'fresh' }}
        uses: actions/download-artifact@v4
        with:
          name: gstreamer-android-prebuilt
          path: fg/gstreamer-android
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_gstreamer_run_id }}

      - name: Download OpenSSL
        uses: actions/download-artifact@v4
        with:
          name: openssl-android-prebuilt
          path: fg/openssl-android

      - name: Download libyuv
        uses: actions/download-artifact@v4
        with:
          name: libyuv-android-prebuilt
          path: fg/libyuv-android

      - name: Download ShadowHook
        uses: actions/download-artifact@v4
        with:
          name: shadowhook-android-prebuilt
          path: fg/shadowhook-android

      - name: Download turbojpeg
        uses: actions/download-artifact@v4
        with:
          name: turbojpeg-android-prebuilt
          path: fg/turbojpeg-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cache the Gradle distribution so we don't re-download gradle-8.9-bin.zip
      # from services.gradle.org on every fresh runner (flaky network caused a
      # SocketException "Unexpected end of file" during the distribution download).
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
            ~/.gradle/caches/build-cache-1
          key: gradle-${{ hashFiles('fg/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # GStreamer is built with NDK r29/LLVM 21. Use the same linker for the
      # APK; older APK NDKs reject LLVM bitcode in some static codec archives.
      - name: Install Android NDK r29 for GStreamer linking
        run: |
          sdkmanager "ndk;29.0.14206865"
          test -x "$ANDROID_SDK_ROOT/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

      - name: Cache NDK r25c
        uses: actions/cache@v4
        with:
          path: android-ndk-r25c
          key: ndk-r25c-linux-v9

      - name: Download Android NDK r25c
        run: |
          if [ ! -d "android-ndk-r25c" ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
            unzip -q android-ndk-r25c-linux.zip
            rm android-ndk-r25c-linux.zip
          fi
          echo "NDK=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Generate local.properties
        working-directory: fg
        run: |
          # Cerbero writes the build-host prefix into pkg-config files. The
          # SDK is downloaded into this job at a different path, so make the
          # two ABI prefixes relocatable before CMake invokes pkg-config.
          for ABI in arm64-v8a armeabi-v7a; do
            SDK="$GITHUB_WORKSPACE/fg/gstreamer-android/$ABI"
            while IFS= read -r PC; do
              if [[ "$PC" == */lib/gstreamer-1.0/pkgconfig/* ]]; then
                LIBDIR='${prefix}/lib/gstreamer-1.0'
              elif [[ "$PC" == */lib/gio/modules/pkgconfig/* ]]; then
                LIBDIR='${prefix}/lib/gio/modules'
              else
                LIBDIR='${prefix}/lib'
              fi
              sed -i \
                -e "s#^prefix=.*#prefix=$SDK#" \
                -e "s#^exec_prefix=.*#exec_prefix=\${prefix}#" \
                -e "s#^libdir=.*#libdir=$LIBDIR#" \
                -e "s#^includedir=.*#includedir=\${prefix}/include#" \
                "$PC"
            done < <(find "$SDK/lib" -type f -name '*.pc')
          done
          echo "sdk.dir=$ANDROID_SDK_ROOT"                              >> local.properties
          echo "gstreamer.dir=$GITHUB_WORKSPACE/fg/gstreamer-android" >> local.properties
          echo "openssl.dir=$GITHUB_WORKSPACE/fg/openssl-android"  >> local.properties
          echo "libyuv.dir=$GITHUB_WORKSPACE/fg/libyuv-android"   >> local.properties

      - name: Make gradlew executable
        working-directory: fg
        run: chmod +x ./gradlew

      - name: Install CMake + Ninja
        run: sudo apt-get install -y cmake ninja-build

      # -- Build hookProxy.so --------------------------------------------------
      # HOOK_PROXY_VERSION is derived automatically from the checked-out git
      # branch + short commit SHA, so the version marker in the .so is ALWAYS
      # accurate and never needs a manual bump. It is logged at load time:
      #   libhookProxy.so loaded ... version=<branch>-<sha>
      - name: Build hookProxy.so (arm64-v8a + armeabi-v7a)
        run: |
          # Derive version from the checked-out repo (branch + short sha).
          FG_BRANCH=$(git -C fg rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")
          FG_SHA=$(git -C fg rev-parse --short=10 HEAD 2>/dev/null || echo "unknown")
          HOOK_VER="${FG_BRANCH}-${FG_SHA}"
          echo "HOOK_PROXY_VERSION=${HOOK_VER}"

          for ABI in arm64-v8a armeabi-v7a; do
            echo "=== Building hookProxy.so for $ABI ==="

            SH_A="fg/shadowhook-android/$ABI/libshadowhook.a"
            if [ ! -f "$SH_A" ]; then
              echo "FATAL: libshadowhook.a not found for $ABI at $SH_A"
              echo "ShadowHook build in Job 1 should have produced this file."
              exit 1
            fi

            BUILD="fg/zygisk-build-$ABI"
            rm -rf "$BUILD"
            mkdir -p "$BUILD"
            cmake fg/zygisk-module/jni \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-28 \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS="-static-libstdc++" \
              -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++" \
              -DHOOK_PROXY_VERSION="$HOOK_VER" \
              -DSHADOWHOOK_ROOT=$GITHUB_WORKSPACE/fg/shadowhook-android \
              -DLIBYUV_ROOT=$GITHUB_WORKSPACE/fg/libyuv-android \
              -DTURBOJPEG_ROOT=$GITHUB_WORKSPACE/fg/turbojpeg-android \
              -GNinja \
              -B "$BUILD"
            cmake --build "$BUILD" -j$(nproc)
            echo "=== hookProxy.so for $ABI: $(ls -lh $BUILD/libhookProxy.so) ==="
          done

      # -- Build amkush_injector (AndKittyInjector + patches) ----------------
      # Build from UPSTREAM MJx0/AndKittyInjector, applying our fixes as patch
      # scripts at build time (no vendored fork to maintain):
      #   1. --pid direct-inject support           -> patches/apply_andkitty_pid.py
      #   2. vDSO gadget exclusion (QCOM/Android13) -> patches/apply_andkitty_vdso_gadget.py
      #      Upstream auto-selects [vdso] as the remote syscall gadget (priority 1),
      #      but the vdso is non-writable/non-steppable on Qualcomm/Android 13 ->
      #      "callSyscall(172): Process didn't stop after syscall!" (SIGTRAP) kills
      #      cameraserver before dlopen() completes. The patch demotes/excludes vdso
      #      so a file-backed .so (libc/apex/system) is used as the gadget instead.
      #   3. vDSO PC redirect safety net          -> patches/apply_andkitty_vdso.py
      #      (redirects the POKEDATA path's injection PC away from the vdso).
      #   4. ARM32 PTRACE_SYSCALL fix (Android 11 / 32-bit) -> patches/apply_andkitty_arm32_syscall.py
      #      On 32-bit ARM, single-stepping `svc #0` in libc.so text via
      #      PTRACE_SINGLESTEP fails with SIGTRAP/CODE=2 (kills cameraserver).
      #      The patch executes the remote syscall with PTRACE_SYSCALL (entry/exit
      #      stops) so the kernel drives the svc reliably on ARM32.
      - name: Build amkush_injector (upstream + --pid + vDSO + ARM32 patches)
        run: |
          if [ ! -f "$NDK/ndk-build" ]; then
            echo "ERROR: ndk-build not found at $NDK/ndk-build"
            exit 1
          fi

          echo "=== Cloning AndKittyInjector (upstream) ==="
          git clone --recursive --depth 1 \
            https://github.com/MJx0/AndKittyInjector.git AndKittyInjector-src

          echo "=== Applying --pid patch ==="
          python3 fg/patches/apply_andkitty_pid.py \
            AndKittyInjector-src/AndKittyInjector/src/main.cpp

          echo "=== Applying vDSO gadget exclusion (QCOM/Android 13 fix) ==="
          python3 fg/patches/apply_andkitty_vdso_gadget.py \
            AndKittyInjector-src/AndKittyInjector/src/Injector/KittyInjectorSyscall.hpp

          echo "=== Applying vDSO PC redirect safety net ==="
          python3 fg/patches/apply_andkitty_vdso.py \
            AndKittyInjector-src/KittyMemoryEx/KittyMemoryEx/KittyTrace.cpp

          echo "=== Applying ARM32 PTRACE_SYSCALL fix (Android 11 / 32-bit) ==="
          python3 fg/patches/apply_andkitty_arm32_syscall.py \
            AndKittyInjector-src/KittyMemoryEx/KittyMemoryEx/KittyTrace.cpp

          echo "=== Applying file-fd dlopen mode (--filefd, bypass namespace w/o memfd) ==="
          python3 fg/patches/apply_andkitty_filefd.py AndKittyInjector-src

          echo "=== Verifying --filefd mode present ==="
          grep -c 'do_filefd_dlopen' \
            AndKittyInjector-src/AndKittyInjector/src/Injector/KittyInjector.cpp \
            || echo "WARNING: --filefd mode not found"

          echo "=== Verifying vdso excluded from gadget scan ==="
          grep -c 'vdso excluded from syscall gadget' \
            AndKittyInjector-src/AndKittyInjector/src/Injector/KittyInjectorSyscall.hpp \
            || echo "WARNING: vdso gadget exclusion not found"

          echo "=== Verifying vDSO PC redirect present ==="
          grep -c 'vDSO PC redirect' \
            AndKittyInjector-src/KittyMemoryEx/KittyMemoryEx/KittyTrace.cpp \
            || echo "WARNING: vDSO redirect not found"

          echo "=== Verifying ARM32 stepSyscall present ==="
          grep -c 'stepSyscall' \
            AndKittyInjector-src/KittyMemoryEx/KittyMemoryEx/KittyTrace.cpp \
            || echo "WARNING: ARM32 stepSyscall not found"

          echo "=== Building (arm64-v8a + armeabi-v7a only) ==="
          sed -i 's/APP_ABI.*:=.*/APP_ABI := arm64-v8a armeabi-v7a/' \
            AndKittyInjector-src/AndKittyInjector/Application.mk
          cat AndKittyInjector-src/AndKittyInjector/Application.mk

          "$NDK/ndk-build" -C AndKittyInjector-src/AndKittyInjector \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            -j$(nproc)

          OUT="AndKittyInjector-src/AndKittyInjector/libs"
          echo "=== amkush_injector build output ==="
          find "$OUT" -type f | sort

          mkdir -p fg/zygisk-module/injector-out
          [ -f "$OUT/arm64-v8a/AndKittyInjector" ]   && \
            cp "$OUT/arm64-v8a/AndKittyInjector"   fg/zygisk-module/injector-out/amkush_injector64
          [ -f "$OUT/armeabi-v7a/AndKittyInjector" ] && \
            cp "$OUT/armeabi-v7a/AndKittyInjector" fg/zygisk-module/injector-out/amkush_injector32

          echo "=== injector-out ==="
          ls -la fg/zygisk-module/injector-out

      # -- Build watchdog_daemon ------------------------------------------------
      - name: Build watchdog_daemon (arm64 + armv7)
        run: |
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          WD_OUT="fg/zygisk-module/injector-out"
          mkdir -p "$WD_OUT"

          build_watchdog() {
            local ABI=$1 TARGET=$2 API=21
            local CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
            local OUT="$WD_OUT/watchdog_daemon_${ABI//-/_}"
            $CC -O2 -pie -fPIE \
              fg/zygisk-module/injector/watchdog_daemon.c \
              -o "$OUT" \
              -llog
            echo "watchdog_daemon $ABI: $(file $OUT)"
          }

          build_watchdog "arm64-v8a"   "aarch64-linux-android"
          build_watchdog "armeabi-v7a" "armv7a-linux-androideabi"

          echo "=== watchdog binaries ==="
          ls -la "$WD_OUT"/watchdog_daemon_*

      # -- Package module assets into APK ------------------------------------
      - name: Package module assets into APK
        run: |
          ASSETS="fg/app/src/main/assets"
          mkdir -p "$ASSETS/system/lib64" "$ASSETS/system/lib" "$ASSETS/system/bin"

          cp fg/zygisk-build-arm64-v8a/libhookProxy.so   "$ASSETS/system/lib64/libhookProxy.so"
          cp fg/zygisk-build-armeabi-v7a/libhookProxy.so "$ASSETS/system/lib/libhookProxy.so"

          INJ64="fg/zygisk-module/injector-out/amkush_injector64"
          INJ32="fg/zygisk-module/injector-out/amkush_injector32"
          [ -f "$INJ64" ] && cp "$INJ64" "$ASSETS/system/bin/amkush_injector64" && chmod 0755 "$ASSETS/system/bin/amkush_injector64"
          [ -f "$INJ32" ] && cp "$INJ32" "$ASSETS/system/bin/amkush_injector32" && chmod 0755 "$ASSETS/system/bin/amkush_injector32"

          WD64="fg/zygisk-module/injector-out/watchdog_daemon_arm64_v8a"
          WD32="fg/zygisk-module/injector-out/watchdog_daemon_armeabi_v7a"
          [ -f "$WD64" ] && cp "$WD64" "$ASSETS/system/bin/watchdog_daemon64" && chmod 0755 "$ASSETS/system/bin/watchdog_daemon64"
          [ -f "$WD32" ] && cp "$WD32" "$ASSETS/system/bin/watchdog_daemon32" && chmod 0755 "$ASSETS/system/bin/watchdog_daemon32"

          echo "=== Module assets packaged ==="
          find "$ASSETS" -type f | sort

      # -- Build Release APK (production-signed) ------------------------------
      - name: Decode production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p /home/runner
            echo "$KEYSTORE_BASE64" | base64 -d > /home/runner/release.jks
            chmod 600 /home/runner/release.jks
            echo "keystore decoded"
            ls -la /home/runner/release.jks
            echo "=== keystore cert fingerprint (should be 3857D85D...) ==="
            keytool -list -v -keystore /home/runner/release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
              | grep -iE "SHA256|Alias name|CN=" | head
          else
            echo "WARNING: KEYSTORE_BASE64 secret missing -- will fall back to debug signing"
          fi

      - name: Build Release APK
        working-directory: fg
        run: |
          KS=/home/runner/release.jks
          ls -la "$KS" || echo "WARNING: keystore not found at $KS"
          echo "=== Gradle version ==="
          ./gradlew --version || true
          SUCCESS=0
          for i in 1 2 3; do
            echo "=== Gradle attempt $i ==="
            ./gradlew assembleRelease \
              -PKEYSTORE_PATH="$KS" \
              -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
              -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
              -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
              --stacktrace && { SUCCESS=1; break; }
            echo "gradle build attempt $i failed -- retrying"
            sleep 10
          done
          if [ "$SUCCESS" != "1" ]; then
            echo "FATAL: All gradle attempts failed"
            exit 1
          fi
          echo "=== APK outputs ==="
          find app/build -type f -name "*.apk" -ls 2>&1 || true
          find . -type f -name "*.apk" -ls 2>&1 | head -n 20 || true
          ls -lh app/build/outputs/apk/release/ 2>&1 || true
          ls -lh app/build/outputs/apk/ 2>&1 || true
          # Fail job if no APK found
          if ! find app/build -name "*.apk" -type f | grep -q .; then
            echo "FATAL: No APK found after build"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FaceGate-APK
          path: |
            fg/app/build/outputs/apk/release/*.apk
            fg/app/build/outputs/apk/**/*.apk
            ${{ github.workspace }}/fg/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # GITHUB RELEASE UPLOAD -> TELEGRAM LINK DELIVERY
      # -----------------------------------------------------------------------
      - name: Upload APK to GitHub Release
        id: gh_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          echo "Searching for APK..."
          find fg/app/build -name "*.apk" -type f -ls || true
          mapfile -t APKS < <(find fg/app/build/outputs -name "*.apk" -type f | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            mapfile -t APKS < <(find fg -name "*.apk" -type f | sort)
          fi
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "- No APK found for release"
            echo "apk_url=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Found split APKs:"
          printf '  %s\n' "${APKS[@]}"
          ls -lh "${APKS[@]}"
          REPO="${{ github.repository }}"
          # Attach every ABI split to the release. The first URL remains the
          # backward-compatible primary output while the release contains both.
          gh release create "$TAG" "${APKS[@]}" \
            --repo "$REPO" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated CI build from branch ${{ github.ref_name }}" \
            2>&1 || true
          APK_NAME=$(basename "${APKS[0]}")
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/${APK_NAME}"
          echo "apk_url=${APK_URL}" >> $GITHUB_OUTPUT
          echo "- Primary split APK: ${APK_URL}"
          echo "- All ABI splits are attached to the release"

      - name: Upload APK to EcomCam (SWISHY endpoint) V5.4 robust
        if: always()
        env:
          UPLOAD_TOKEN: ${{ secrets.FACEDOCS_UPLOAD_TOKEN }}
        run: |
          echo "=== V5.4 Upload SWISHY APK to ecomcam.cyou/swishy ==="
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "PWD: $(pwd)"
          ls -la
          echo "=== Searching APKs in fg/ ==="
          find fg -type f -name "*.apk" -ls 2>&1 | head -n 200 || true
          echo "=== Searching APKs in $GITHUB_WORKSPACE ==="
          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -ls 2>&1 | head -n 200 || true
          # Robust find order: release first, then any apk, then debug
          APK_PATH=$(find fg/app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | head -n1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find fg/app/build/outputs -name "*.apk" -type f 2>/dev/null | head -n1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find fg -name "*.apk" -type f 2>/dev/null | head -n1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "$GITHUB_WORKSPACE/fg/app/build/outputs" -name "*.apk" -type f 2>/dev/null | head -n1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "$GITHUB_WORKSPACE/fg" -name "*.apk" -type f 2>/dev/null | head -n1)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -n1)
          fi
          echo "Resolved APK_PATH=$APK_PATH"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            ls -lh "$APK_PATH"
            cp "$APK_PATH" /tmp/swishy.apk
            echo "Copied to /tmp/swishy.apk"
            ls -lh /tmp/swishy.apk
          else
            echo "FATAL: APK file missing"
            find . -type f -name "*.apk" -ls 2>&1 | head -n 200 || true
            find /home/runner -type f -name "*.apk" -ls 2>&1 | head -n 200 || true
            exit 1
          fi
          FG_BRANCH=$(git -C fg rev-parse --abbrev-ref HEAD 2>/dev/null || echo swishy)
          FG_BUILD=$(git -C fg rev-parse --short=10 HEAD 2>/dev/null || echo unknown)
          FG_VERSION=$(grep -r "FRAME_PRODUCER_VERSION" fg/app/src/main/cpp/gstreamer_frame_producer.cpp 2>/dev/null | head -1 || echo "GSTREAMER")
          echo "Uploading /tmp/swishy.apk branch=$FG_BRANCH build=$FG_BUILD version=$FG_VERSION to ecomcam.cyou"
          curl -v --resolve ecomcam.cyou:443:72.62.240.124 -X POST https://ecomcam.cyou/uploadswishy \
            -H "x-upload-token: $UPLOAD_TOKEN" \
            -F "apk=@/tmp/swishy.apk" \
            -F "build=${FG_BUILD}" \
            -F "branch=${FG_BRANCH}" \
            -F "version=${FG_VERSION}" 2>&1 && echo "SUCCESS Uploaded to https://ecomcam.cyou/swishy (build ${FG_BUILD})" \
            || { echo "FAIL EcomCam swishy upload failed"; exit 1; }
          echo "Checking https://ecomcam.cyou/swishy ..."
          curl -s --resolve ecomcam.cyou:443:72.62.240.124 https://ecomcam.cyou/swishy 2>&1 | head -n 50 || true
          curl -s --resolve ecomcam.cyou:443:72.62.240.124 https://ecomcam.cyou/api/swishy/version 2>&1 | head -n 20 || true

      - name: Send download links to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            - *FaceGate Build Complete*

            - Repository: `${{ github.repository }}`
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
            - By: `${{ github.actor }}`
            -- Built at: `${{ github.event.head_commit.timestamp }}`

            - [Download APK](${{ steps.gh_release.outputs.apk_url }})

            - Hosted on GitHub Releases
          format: markdown
# V4.7.9 AR-crop fix: re-trigger build
# V4.7.9 dim-swap fix + rotation 270 re-trigger
# V4.7.9 dim-swap fixed + rotation 90 CW (correct direction)
# V4.7.9-R5: rot fallback 180; portrait stretch fix; zoom-out lockPlanes bug
# V4.8.0: green-frame fix (size ring to source) + no portrait stretch + YV12 chroma fix
# V4.8.1: fix image-injection glitch (linesize stride) + play/stop overlay button
# V4.8.2: fix zoom buttons sometimes rotating frames (decouple zoom from rotation)
# V4.8.3: fix zoom-out dropping rotation (native letterbox path applies rotation)
# V4.8.4: fix injected-media quality (preserve aspect ratio + Lanczos scaling)
# V4.8.5: fix rotate never reaching upright (0->180 fallback bug)
# V4.8.5.mtk.1: fix RTSP frames distorted (skip auto-rotation for live streams)
# V4.8.5.qcom.1: Android 13 injector vDSO fix (patch applied to upstream)
# V4.8.5.2: combined branch -- Android 13 (qcom) + Android 14 (mtk) fixes
# V4.8.5.3: Android 13/qcom -- stop using vdso as syscall gadget (injector fix)
# V4.8.5.3.md.1: RTSP quality fix + hook version banner + original-metadata logging
# V4.8.5.4: Android 11 (32-bit) dlopen 'library not found' -- use memfd dlopen
# V4.8.5.4.1: metadata-only observer for processCaptureResult (logs original camera metadata + values)
#   NOTE: injector is built from upstream MJx0/AndKittyInjector with our patch
#   scripts applied at build time:
#     apply_andkitty_pid.py          -> --pid direct-inject support
#     apply_andkitty_vdso_gadget.py  -> exclude vdso from syscall gadget scan
#     apply_andkitty_vdso.py         -> vDSO PC redirect safety net
#     apply_andkitty_arm32_syscall.py -> ARM32 PTRACE_SYSCALL fix
# V4.8.5.5: Fix Android 16 cameraserver crash + fmt=0x22 stride + zero-latency OBS live stream flush
# V5.4-UNISOC-OBS22S-FIX: 22s-><1s OBS, stimeout 1s, rw_timeout 2s, reconnect loop, swishy trigger + robust APK upload
